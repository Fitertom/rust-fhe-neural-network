[package]
name = "ppnn"
version = "0.1.0"
edition = "2021"
description = "Privacy-Preserving Neural Network with LWE-based FHE from scratch"

[dependencies]
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
rusttype = "0.9"
image = "0.25"
ureq = "2"

[[bin]]
name = "ppnn"
path = "src/main.rs"
