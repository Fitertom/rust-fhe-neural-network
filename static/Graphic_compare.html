<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Training Comparison Tool</title>
    <!-- Подключаем Tailwind CSS для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ПОРЯДОК ЗАГРУЗКИ: React -> ReactDOM -> Prop-Types -> Recharts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types необходим для Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Подключаем Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Подключаем Babel для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Подключаем Lucide (иконки) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .recharts-cartesian-grid-horizontal line {
            stroke: #f1f5f9;
        }
        textarea::placeholder {
            color: #94a3b8;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { 
            ResponsiveContainer, ComposedChart, Line, XAxis, YAxis, 
            CartesianGrid, Tooltip, Legend 
        } = Recharts;

        // Исправленный компонент Icon для работы с Lucide в браузере
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    // Конвертируем PascalCase (Settings2) в kebab-case (settings-2)
                    const kebabName = name
                        .replace(/([a-z])([A-Z0-9])/g, '$1-$2')
                        .toLowerCase();
                    
                    // Создаем временный элемент i для Lucide
                    iconRef.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                    
                    // Инициализируем иконку
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: {
                            width: size,
                            height: size,
                            class: className,
                            'stroke-width': 2
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const COLORS = [
            '#10b981', '#3b82f6', '#f43f5e', '#8b5cf6', '#f59e0b', '#06b6d4'
        ];

        const parseLogs = (text) => {
            if (!text) return [];
            const lines = text.trim().split('\n');
            return lines.map(line => {
                const epochMatch = line.match(/Epoch (\d+)/);
                const testMatch = line.match(/test=([\d.]+)%/);
                const lrMatch = line.match(/lr=([\d.]+)/);

                if (epochMatch && testMatch && lrMatch) {
                    return {
                        epoch: parseInt(epochMatch[1]),
                        test: parseFloat(testMatch[1]),
                        lr: parseFloat(lrMatch[1]) * 1000,
                    };
                }
                return null;
            }).filter(Boolean);
        };

        const App = () => {
            const [runs, setRuns] = useState([
                { id: Date.now(), name: 'Запуск 1', raw: '', color: COLORS[0] }
            ]);

            const addRun = () => {
                if (runs.length < COLORS.length) {
                    setRuns(prev => [...prev, { 
                        id: Date.now() + prev.length, 
                        name: `Запуск ${prev.length + 1}`, 
                        raw: '', 
                        color: COLORS[prev.length] 
                    }]);
                }
            };

            const updateRun = (id, text) => {
                setRuns(prev => prev.map(r => r.id === id ? { ...r, raw: text } : r));
            };

            const removeRun = (id) => {
                if (runs.length > 1) {
                    setRuns(prev => prev.filter(r => r.id !== id));
                }
            };

            const chartData = useMemo(() => {
                const parsedRuns = runs.map(r => ({ id: r.id, data: parseLogs(r.raw) }));
                const allEpochs = parsedRuns.flatMap(r => r.data.map(d => d.epoch));
                const maxEpoch = allEpochs.length > 0 ? Math.max(...allEpochs) : 0;
                
                if (maxEpoch === 0) return [];

                const result = [];
                for (let i = 1; i <= maxEpoch; i++) {
                    const entry = { epoch: i };
                    parsedRuns.forEach((run) => {
                        const epochData = run.data.find(d => d.epoch === i);
                        if (epochData) {
                            entry[`test_${run.id}`] = epochData.test;
                            entry[`lr_${run.id}`] = epochData.lr;
                        }
                    });
                    result.push(entry);
                }
                return result;
            }, [runs]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
                    {/* Боковая панель */}
                    <div className="w-full md:w-96 bg-white border-r border-slate-200 p-6 overflow-y-auto max-h-screen shadow-sm z-10">
                        <div className="flex items-center gap-3 mb-8">
                            <div className="p-2 bg-blue-50 rounded-lg text-blue-600">
                                <Icon name="Settings2" size={20} />
                            </div>
                            <h1 className="text-xl font-black tracking-tight text-slate-800 uppercase">Ввод данных</h1>
                        </div>

                        <div className="space-y-6">
                            {runs.map((run) => (
                                <div key={run.id} className="p-4 rounded-2xl border border-slate-200 bg-white space-y-3 shadow-sm transition-all hover:border-slate-300">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <div className="w-4 h-4 rounded-full shadow-sm" style={{ backgroundColor: run.color }} />
                                            <span className="font-bold text-sm text-slate-700">{run.name}</span>
                                        </div>
                                        <button 
                                            onClick={() => removeRun(run.id)}
                                            className="text-slate-300 hover:text-rose-500 p-1.5 hover:bg-rose-50 rounded-lg transition-all"
                                            title="Удалить"
                                        >
                                            <Icon name="Trash2" size={16} />
                                        </button>
                                    </div>
                                    <textarea
                                        className="w-full h-36 p-3 text-[11px] font-mono bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all resize-none shadow-inner"
                                        placeholder="Вставьте логи из консоли (Epoch ...)"
                                        value={run.raw}
                                        onChange={(e) => updateRun(run.id, e.target.value)}
                                    />
                                </div>
                            ))}

                            <button
                                onClick={addRun}
                                disabled={runs.length >= COLORS.length}
                                className="w-full py-4 border-2 border-dashed border-slate-300 rounded-2xl text-slate-400 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 transition-all flex items-center justify-center gap-2 font-bold text-sm disabled:opacity-30 disabled:cursor-not-allowed"
                            >
                                <Icon name="Plus" size={18} />
                                Добавить сравнение
                            </button>
                        </div>
                    </div>

                    {/* График */}
                    <div className="flex-1 p-6 md:p-10 flex flex-col min-w-0">
                        <div className="flex items-center gap-4 mb-8">
                            <div className="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-200">
                                <Icon name="Activity" className="text-white" />
                            </div>
                            <div>
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight leading-none mb-1">Анализ QAT</h2>
                                <p className="text-slate-400 text-sm font-medium">Инструмент сравнения точности запусков</p>
                            </div>
                        </div>

                        <div className="flex-1 bg-white rounded-[2.5rem] shadow-sm border border-slate-200/60 p-6 md:p-8 flex flex-col min-h-[500px]">
                            {chartData.length === 0 ? (
                                <div className="flex-1 flex flex-col items-center justify-center text-slate-300 space-y-6">
                                    <div className="p-10 bg-slate-50 rounded-full border border-slate-100">
                                        <Icon name="LineChart" size={80} className="opacity-10" />
                                    </div>
                                    <div className="text-center">
                                        <p className="font-bold text-slate-500 uppercase tracking-[0.2em] text-xs mb-3">Данные отсутствуют</p>
                                        <p className="text-sm text-slate-400 max-w-[280px] leading-relaxed mx-auto">
                                            Скопируйте текст обучения из вашей консоли и вставьте его в поля слева.
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={chartData} margin={{ top: 10, right: 10, left: -15, bottom: 0 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis 
                                            dataKey="epoch" 
                                            tick={{fontSize: 11, fill: '#64748b', fontWeight: 600}}
                                            axisLine={false}
                                            tickLine={false}
                                        />
                                        <YAxis 
                                            tick={{fontSize: 11, fill: '#64748b', fontWeight: 600}}
                                            axisLine={false}
                                            tickLine={false}
                                            domain={['auto', 'auto']}
                                        />
                                        <Tooltip 
                                            contentStyle={{ 
                                                borderRadius: '20px', 
                                                border: 'none', 
                                                boxShadow: '0 25px 50px -12px rgba(0,0,0,0.15)',
                                                padding: '16px',
                                                fontSize: '12px'
                                            }}
                                            itemStyle={{ fontWeight: 'bold' }}
                                        />
                                        <Legend 
                                            verticalAlign="top" 
                                            align="right"
                                            iconType="circle"
                                            wrapperStyle={{ paddingBottom: '30px', fontSize: '12px', fontWeight: 'bold', color: '#64748b' }} 
                                        />
                                        
                                        {runs.map(run => (
                                            <Line
                                                key={`line_${run.id}`}
                                                type="monotone"
                                                name={`${run.name} (%)`}
                                                dataKey={`test_${run.id}`}
                                                stroke={run.color}
                                                strokeWidth={3}
                                                dot={false}
                                                activeDot={{ r: 6, strokeWidth: 0 }}
                                                isAnimationActive={true}
                                            />
                                        ))}
                                        {runs.map(run => (
                                            <Line
                                                key={`lr_${run.id}`}
                                                type="stepAfter"
                                                name={`${run.name} (LR)`}
                                                dataKey={`lr_${run.id}`}
                                                stroke={run.color}
                                                strokeWidth={1}
                                                strokeDasharray="4 4"
                                                dot={false}
                                                opacity={0.3}
                                                isAnimationActive={true}
                                            />
                                        ))}
                                    </ComposedChart>
                                </ResponsiveContainer>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
